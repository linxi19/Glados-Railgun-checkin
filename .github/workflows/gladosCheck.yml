name: GLaDOS Checkin

on:
  schedule:
    # UTC 01:23 / 07:23 / 13:23 = 北京时间 09:23 / 15:23 / 21:23
    - cron: '23 1,7,13 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: glados-checkin
  cancel-in-progress: false

jobs:
  checkin:
    name: Account ${{ matrix.account }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        include:
          - account: 1
            cookie_secret: GLADOS_COOKIE
            legacy_cookie_secret: GLADOS_COOKIES
            base_url_variable: GLADOS_BASE_URL
            default_base_url: https://glados.cloud
            user_agent_variable: GLADOS_USER_AGENT
          - account: 2
            cookie_secret: GLADOS_COOKIE_2
            legacy_cookie_secret: GLADOS_COOKIE_2
            base_url_variable: GLADOS_BASE_URL_2
            default_base_url: https://glados-facility.com
            user_agent_variable: GLADOS_USER_AGENT_2
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Check in and verify
        env:
          GLADOS_COOKIE: ${{ secrets[matrix.cookie_secret] }}
          GLADOS_COOKIES: ${{ secrets[matrix.legacy_cookie_secret] }}
          GLADOS_BASE_URL: ${{ vars[matrix.base_url_variable] || matrix.default_base_url }}
          GLADOS_USER_AGENT: ${{ vars[matrix.user_agent_variable] }}
          PYTHONUNBUFFERED: '1'
          PYTHONUTF8: '1'
        run: python main.py
