name: GLaDOS Checkin

on:
  schedule:
    # UTC 01:23 / 07:23 / 13:23 = 北京时间 09:23 / 15:23 / 21:23
    - cron: '23 1,7,13 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: glados-checkin
  cancel-in-progress: false

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Check in and verify
        env:
          GLADOS_COOKIE: ${{ secrets.GLADOS_COOKIE }}
          GLADOS_COOKIES: ${{ secrets.GLADOS_COOKIES }}
          GLADOS_BASE_URL: ${{ vars.GLADOS_BASE_URL }}
          GLADOS_USER_AGENT: ${{ vars.GLADOS_USER_AGENT }}
          PYTHONUNBUFFERED: '1'
          PYTHONUTF8: '1'
        run: python main.py
